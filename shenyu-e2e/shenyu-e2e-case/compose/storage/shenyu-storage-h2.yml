version: '3.9'

services:
  shenyu-httpbin:
    image: kennethreitz/httpbin@sha256:599fe5e5073102dbb0ee3dbb65f049dab44fa9fc251f6835c9990f8fb196a72b
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/anything', timeout=3)" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - shenyu


  shenyu-admin:
    image: apache/shenyu-admin:latest
    container_name: shenyu-admin
    command: [ "-Xmx768m", "-Xms768m" ]
    ports:
      - "31095:9095"
    environment:
      - TZ=Asia/Beijing
      - SPRING_PROFILES_ACTIVE=h2
      - shenyu.database.init_script=sql-script/h2/schema.sql
      - shenyu.sync.websocket.enabled=true
      - shenyu.sync.websocket.messageMaxSize=10240
      - shenyu.sync.websocket.allowOrigins=ws://localhost:9095;ws://localhost:9195;
      - shenyu.sync.websocket.token=shenyu-sync-token
      - shenyu.jwt.secretKey=shenyu-e2e-jwt-secret-key-2024
    volumes:
      - /tmp/shenyu-e2e/mysql/driver:/opt/shenyu-admin/ext-lib
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://shenyu-admin:9095/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: always
    networks:
      - shenyu

  shenyu-bootstrap:
    image: apache/shenyu-bootstrap:latest
    container_name: shenyu-bootstrap
    ports:
      - "31195:9195"
    environment:
      - TZ=Asia/Beijing
      - shenyu.sync.websocket.urls=ws://shenyu-admin:9095/websocket
      - shenyu.sync.websocket.token=shenyu-sync-token
      - shenyu.sync.websocket.allowOrigin=ws://localhost:9195
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://shenyu-bootstrap:9195/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: always
    depends_on:
      shenyu-httpbin:
        condition: service_healthy
      shenyu-admin:
        condition: service_healthy
    networks:
      - shenyu

networks:
  shenyu:
    name: shenyu
    driver: bridge
    external: true
